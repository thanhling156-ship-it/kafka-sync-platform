server:
  port: 8084

spring:
  application:
    name: repo-service

  datasource:
    # Port 5436 đúng theo bảng docker ps của bạn
    url: jdbc:postgresql://localhost:5436/repo_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: repo-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.example.event_library"
    # Nếu Repo có bắn trả lại RepoStatusEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example.repo_service: DEBUG