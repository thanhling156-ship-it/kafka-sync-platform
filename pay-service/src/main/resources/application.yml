server:
  port: 8085

spring:
  application:
    name: pay-service

  datasource:
    # SAI: 5432 là cổng nội bộ Docker.
    # ĐÚNG: Phải dùng 5437 (cổng bạn đã map ra ngoài Laptop cho pay-db)
    url: jdbc:postgresql://localhost:5437/pay_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # NÊN THÊM: Để tránh lỗi Dialect lúc nãy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    # SAI: kafka:29092 chỉ dành cho các container nói chuyện với nhau.
    # ĐÚNG: localhost:9092 (Cổng EXTERNAL bạn đã mở ra cho IDE)
    bootstrap-servers: localhost:9092
    consumer:
      group-id: pay-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.example.event_library"

eureka:
  client:
    service-url:
      # SAI: discovery-server:8761 (Code local không hiểu tên này)
      # ĐÚNG: localhost:8761
      defaultZone: http://localhost:8761/eureka/
  instance:
    # QUAN TRỌNG: Khi chạy Hybrid, phải dùng IP để các service thấy nhau
    prefer-ip-address: true

logging:
  level:
    com.example.pay_service: DEBUG # Sửa lại đúng package của bạn